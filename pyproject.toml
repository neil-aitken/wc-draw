[project]
name = "wc-draw"
version = "0.1.0"
description = "A new Python project managed with uv."
authors = [
	{ name = "Neil Aitken", email = "aitken15@gmail.com" }
]
requires-python = ">=3.14"


[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = []

[tool.pyrefly]
project-includes = [
    "wc_draw/**/*.py",
    "scripts/test_draw_v2.py",
    "tests/**/*.py",
    "validate_seed.py",
]
project-excludes = [
    "**/__pycache__/**",
    "**/.venv/**",
    "**/build/**",
    "**/dist/**",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402", "E501"]  # Allow import-after-sys.path and long lines
"notebooks/*.ipynb" = ["E402", "E501"]  # Notebooks have different import patterns

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
]
